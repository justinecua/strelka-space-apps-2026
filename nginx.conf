# Serves the built Strelka website. HTTPS is handled by Cloudflare, so nginx only listens on plain HTTP inside Docker.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The voice check-in needs the microphone, so allow it for this site only.
    add_header Permissions-Policy "microphone=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Built files have a hash in their name, so browsers can keep them for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Always re-check index.html so a new deploy shows up right away.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
